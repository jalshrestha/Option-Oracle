name: Full Stack Checks

on:
  push:
    paths:
      - 'backend/**'
      - 'Frontend/**'
      - '.github/workflows/test.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'Frontend/**'
      - '.github/workflows/test.yml'
      - 'docker-compose.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: options_oracle_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d options_oracle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Run database migrations
        run: cd backend && PYTHONPATH=. alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@localhost:${{ job.services.postgres.ports[5432] }}/options_oracle_test
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing-only-32plus
          OPENAI_API_KEY: test-openai-api-key
          GEMINI_API_KEY: test-gemini-placeholder-for-ci

      - name: Run backend e2e and integration tests
        run: |
          cd backend
          status=0
          for target in \
            tests/integration/test_system_routes.py \
            tests/e2e/test_analysis_flow.py \
            tests/e2e/test_error_scenarios.py \
            tests/integration/test_analysis_routes.py \
            tests/integration/test_auth_routes.py \
            tests/integration/test_chat_routes.py \
            tests/integration/test_portfolio_routes.py \
            tests/integration/test_trading_routes.py
          do
            log_file="pytest-${target//\//-}.log"
            set +e
            python -m pytest "$target" -vv --tb=short --color=no 2>&1 | tee "$log_file"
            test_status=${PIPESTATUS[0]}
            set -e
            if [ "$test_status" -ne 0 ]; then
              echo "::error title=backend pytest file failed::${target}"
              echo "::error title=${target} exit status::${test_status}"
              while IFS= read -r line; do
                escaped="${line//'%'/'%25'}"
                escaped="${escaped//$'\r'/'%0D'}"
                escaped="${escaped//$'\n'/'%0A'}"
                echo "::error title=${target} failure::${escaped}"
              done < <(tail -120 "$log_file" | tac | head -40)
              status=1
            fi
          done
          exit "$status"
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@localhost:${{ job.services.postgres.ports[5432] }}/options_oracle_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}/0
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing-only-32plus
          OPENAI_API_KEY: test-openai-api-key
          GEMINI_API_KEY: test-gemini-placeholder-for-ci
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: test-placeholder-key
          ENV: development

      - name: Run backend unit tests
        run: |
          cd backend
          python -m pytest \
            tests/unit/test_agents.py \
            tests/unit/test_error_handlers.py \
            tests/unit/test_indicators.py \
            tests/unit/test_intelligent_orchestrator.py \
            tests/unit/test_middleware.py \
            tests/unit/test_ml_models.py \
            tests/unit/test_repositories.py \
            tests/unit/test_schemas.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@localhost:${{ job.services.postgres.ports[5432] }}/options_oracle_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}/0
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing-only-32plus
          OPENAI_API_KEY: test-openai-api-key
          GEMINI_API_KEY: test-gemini-placeholder-for-ci
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: test-placeholder-key
          ENV: development

      - name: Run backend service and settings tests
        run: cd backend && python -m pytest tests/unit/test_services.py tests/unit/test_settings.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@localhost:${{ job.services.postgres.ports[5432] }}/options_oracle_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}/0
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing-only-32plus
          OPENAI_API_KEY: test-openai-api-key
          GEMINI_API_KEY: test-gemini-placeholder-for-ci
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: test-placeholder-key
          ENV: development

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd Frontend && pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: cd Frontend && pnpm run lint

      - name: Run frontend tests
        run: cd Frontend && pnpm test

      - name: Build frontend
        run: cd Frontend && pnpm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t option-oracle-backend:ci ./backend

      - name: Build backend test image
        run: docker build --target test -t option-oracle-backend-test:ci ./backend

      - name: Build frontend image
        run: docker build -t option-oracle-frontend:ci ./Frontend
